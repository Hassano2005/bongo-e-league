<script src="main.js"></script>
<script>
    // 🔗 Your live backend API - ADD THIS CONSTANT
    const API_BASE = 'https://bongo-e-league-31xh.onrender.com';

    function showPanel(name) {
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
        const panel = document.getElementById(`panel-${name}`);
        if (panel) panel.classList.add('active');
        const link = document.querySelector(`[data-panel="${name}"]`);
        if (link) link.classList.add('active');
    }

    async function createTournament() {
        const btn = document.querySelector('#createTournamentModal .btn-primary');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
        btn.disabled = true;

        try {
            const token = localStorage.getItem('league_token');
            if(!token) {
                showToast('You must be logged in as an admin', 'error'); 
                btn.innerHTML = originalText;
                btn.disabled = false;
                return;
            }

            const nameInput = document.querySelector('#createTournamentModal .form-input[placeholder*="Weekend Warriors"]');
            const name = nameInput.value.trim() || 'Bongo eLeague Tournament';
            const fee = document.getElementById('adminEntryFee').value;
            const prizeDisplay = document.getElementById('prize1st').textContent;
            const prizeVal = parseInt(prizeDisplay.replace(/,/g, '').replace(' TZS','')) || 0;

            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/tournaments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name: name, entry_fee: parseInt(fee), prize_pool: prizeVal, status: 'upcoming' })
            });

            if (res.ok) {
                closeModal('createTournamentModal');
                showToast('Knockout tournament created! Players can now register.', 'success');
                setTimeout(() => window.location.reload(), 1500);
            } else {
                showToast('Failed to create tournament. Check server.', 'error');
            }
        } catch(err) {
            showToast('Server connection error', 'error');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    document.querySelectorAll('.sidebar-link[data-panel]').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            showPanel(link.dataset.panel);
        });
    });

    /* Rounds preview in modal */
    function getRoundNames(count) {
        const names = [];
        let c = count;
        while (c >= 2) {
            if      (c === 32) names.push({ label: 'R32', emoji: '⚔️' });
            else if (c === 16) names.push({ label: 'R16', emoji: '⚔️' });
            else if (c === 8)  names.push({ label: 'QF', emoji: '🔥' });
            else if (c === 4)  names.push({ label: 'SF', emoji: '⚡' });
            else if (c === 2)  names.push({ label: 'Final', emoji: '🏆' });
            c = Math.floor(c / 2);
        }
        names.push({ label: 'Champion', emoji: '👑' });
        return names;
    }

    function updateRoundsPreview() {
        const count = parseInt(document.getElementById('adminPlayerCount').value);
        const matchType = document.getElementById('adminMatchType').value;
        const rounds = getRoundNames(count);
        const container = document.getElementById('adminRoundsPreview');
        const legText = matchType === 'home-away' ? ' (2 Legs)' : '';

        container.innerHTML = rounds.map(r => `
            <span class="badge" style="background:rgba(255,255,255,0.05); border:1px solid var(--border-light); font-size:0.7rem; color:var(--text-muted);">
                ${r.emoji} ${r.label}${legText}
            </span>
        `).join('');
        updatePrizePreview();
    }

    function updatePrizePreview() {
        const fee = parseInt(document.getElementById('adminEntryFee').value) || 0;
        const count = parseInt(document.getElementById('adminPlayerCount').value);
        let pool = fee * count;
        if (fee === 3000 && count === 16) pool = 35000;
        const fmt = (v) => v > 0 ? v.toLocaleString() + ' TZS' : '— TZS';
        document.getElementById('prize1st').textContent = fmt(pool);
        document.getElementById('prize2nd').textContent = 'FREE ENTRY';
    }

    updateRoundsPreview();

    async function fetchAdminTournaments() {
        try {
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/tournaments`);
            const data = await res.json();
            const listCard = document.getElementById('adminTournamentsListCard');
            if (data && data.length > 0) {
                let html = '<div style="min-width: 600px;"><div style="display:grid;grid-template-columns:1fr 1fr 100px 100px 40px;gap:1rem;padding:1rem;background:rgba(0,0,0,0.2);font-size:0.75rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;"><div>Name</div><div>Status</div><div>Entry Fee</div><div>Prize</div><div></div></div>';
                data.forEach(t => {
                    html += `<div style="display:grid;grid-template-columns:1fr 1fr 100px 100px 40px;gap:1rem;padding:1rem;border-top:1px solid rgba(255,255,255,0.05);align-items:center;font-size:0.85rem;">
                        <div style="font-weight:bold;color:var(--text-light);">${t.name} <span style="font-size:0.7rem;color:var(--text-muted);font-weight:normal;margin-left:5px;">(${t.joined_count || 0} joined)</span></div>
                        <div><span class="badge" style="background:rgba(0,210,255,0.1);color:var(--primary);">${t.status.toUpperCase()}</span></div>
                        <div>${t.entry_fee}</div>
                        <div style="color:var(--accent-gold);font-weight:bold;">${t.prize_pool}</div>
                        <button class="btn btn-ghost btn-sm" style="color:var(--accent);padding:0.35rem;border-color:transparent;" onclick="deleteTournament(${t.id}, this)" title="Delete"><i class="fas fa-trash"></i></button>
                    </div>`;
                });
                html += '</div>';
                listCard.innerHTML = html;
            }
        } catch(err) { console.error('Failed to load admin tournaments', err); }
    }

    async function fetchAdminStats() {
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/stats`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const stats = await res.json();
                const statNums = document.querySelectorAll('.admin-stat-num');
                if(statNums.length >= 4) {
                    statNums[0].textContent = stats.totalPlayers?.toLocaleString() || '0';
                    statNums[1].textContent = stats.totalTournaments?.toLocaleString() || '0';
                    statNums[2].textContent = stats.paidOut?.toLocaleString() || '0';
                    statNums[3].textContent = stats.pendingActions?.toLocaleString() || '0';
                }
            }
        } catch(err) { console.error('Failed to load admin stats', err); }
    }

    async function deleteTournament(id, btn) {
        if(!confirm('Are you sure you want to delete this tournament?')) return;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/tournaments/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                showToast('Tournament deleted', 'success');
                fetchAdminTournaments(); fetchAdminStats();
            } else { showToast('Failed to delete', 'error'); }
        } catch(err) { showToast('Server error', 'error'); }
        finally { btn.innerHTML = originalHtml; btn.disabled = false; }
    }

    async function fetchAdminPlayers() {
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/players`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const playersCard = document.querySelector('#panel-players .card');
            if (data && data.length > 0) {
                let html = '<div style="min-width: 600px;"><div style="display:grid;grid-template-columns:1fr 150px 100px 50px;gap:1rem;padding:1rem;background:rgba(0,0,0,0.2);font-size:0.75rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;"><div>Player</div><div>Phone</div><div>Tourneys</div><div></div></div>';
                data.forEach(p => {
                    html += `<div style="display:grid;grid-template-columns:1fr 150px 100px 50px;gap:1rem;padding:1rem;border-top:1px solid rgba(255,255,255,0.05);align-items:center;font-size:0.85rem;">
                        <div style="font-weight:bold;color:var(--text-light);">${p.username}</div>
                        <div style="color:var(--text-muted);">${p.phone}</div>
                        <div style="color:var(--primary);font-weight:bold;">${p.tournaments_joined}</div>
                        <button class="btn btn-ghost btn-sm" style="color:var(--accent);" onclick="deletePlayer(${p.id}, this)"><i class="fas fa-trash"></i></button>
                    </div>`;
                });
                html += '</div>';
                playersCard.innerHTML = html;
            }
        } catch(err) { console.error('Failed to load players', err); }
    }

    async function deletePlayer(id, btn) {
        if(!confirm('Permanently remove this user?')) return;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/players/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                showToast('User removed', 'success');
                fetchAdminPlayers(); fetchAdminStats();
            } else { showToast('Failed to remove', 'error'); }
        } catch(err) { showToast('Server error', 'error'); }
        finally { btn.innerHTML = originalHtml; btn.disabled = false; }
    }

    async function fetchAdminPayments() {
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/payments`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const paymentsCard = document.querySelector('#panel-payments .card');
            if (data && data.length > 0) {
                let html = '<div style="min-width: 700px;"><div style="display:grid;grid-template-columns:1fr 1fr 100px 100px 120px;gap:1rem;padding:1rem;background:rgba(0,0,0,0.2);font-size:0.75rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;"><div>Player</div><div>Tournament</div><div>Phone</div><div>Amount</div><div>Actions</div></div>';
                data.forEach(p => {
                    html += `<div style="display:grid;grid-template-columns:1fr 1fr 100px 100px 120px;gap:1rem;padding:1rem;border-top:1px solid rgba(255,255,255,0.05);align-items:center;font-size:0.85rem;">
                        <div style="font-weight:bold;color:var(--text-light);">${p.username}</div>
                        <div style="color:var(--text-muted);">${p.tournament_name}</div>
                        <div style="color:var(--text-muted);">${p.phone_number}</div>
                        <div style="color:var(--accent-gold);font-weight:bold;">${p.amount}</div>
                        <div style="display:flex;gap:5px;">
                            <button class="btn btn-primary btn-sm" onclick="approvePayment(${p.id}, this)"><i class="fas fa-check"></i></button>
                            <button class="btn btn-outline btn-sm" style="color:var(--accent);border-color:var(--accent);" onclick="rejectPayment(${p.id}, this)"><i class="fas fa-times"></i></button>
                        </div>
                    </div>`;
                });
                html += '</div>';
                paymentsCard.innerHTML = html;
            }
        } catch(err) { console.error('Failed to load payments', err); }
    }

    async function approvePayment(id, btn) {
        if(!confirm('Approve this payment?')) return;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/payments/${id}/approve`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) { showToast('Payment approved', 'success'); fetchAdminPayments(); fetchAdminStats(); }
            else { showToast('Failed to approve', 'error'); }
        } catch(err) { showToast('Server error', 'error'); }
        finally { btn.innerHTML = '<i class="fas fa-check"></i>'; btn.disabled = false; }
    }

    async function rejectPayment(id, btn) {
        if(!confirm('Reject this payment?')) return;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/payments/${id}/reject`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) { showToast('Payment rejected', 'success'); fetchAdminPayments(); }
            else { showToast('Failed to reject', 'error'); }
        } catch(err) { showToast('Server error', 'error'); }
        finally { btn.innerHTML = '<i class="fas fa-times"></i>'; btn.disabled = false; }
    }

    async function fetchAdminVerifications() {
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/verifications`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const verifCard = document.querySelector('#panel-verification .card');
            if (data && data.length > 0) {
                let html = '<div style="min-width: 650px;"><div style="display:grid;grid-template-columns:1fr 150px 100px 120px;gap:1rem;padding:1rem;background:rgba(0,0,0,0.2);font-size:0.75rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;"><div>Match</div><div>Score</div><div>Screenshot</div><div>Actions</div></div>';
                data.forEach(v => {
                    html += `<div style="display:grid;grid-template-columns:1fr 150px 100px 120px;gap:1rem;padding:1rem;border-top:1px solid rgba(255,255,255,0.05);align-items:center;font-size:0.85rem;">
                        <div><div style="font-weight:bold;color:var(--text-light);">${v.tournament_name}</div><div style="color:var(--text-muted);font-size:0.75rem;">${v.submitter_name} vs ${v.opponent_name}</div></div>
                        <div style="color:var(--text-light);font-weight:bold;font-size:1.1rem;font-family:'Orbitron',sans-serif;">${v.my_score} - ${v.opponent_score}</div>
                        <div><a href="${v.screenshot_url}" target="_blank" class="btn btn-outline btn-sm"><i class="fas fa-image"></i> View</a></div>
                        <div style="display:flex;gap:5px;">
                            <button class="btn btn-primary btn-sm" onclick="approveVerification(${v.id}, this)"><i class="fas fa-check"></i></button>
                            <button class="btn btn-outline btn-sm" style="color:var(--accent);border-color:var(--accent);" onclick="rejectVerification(${v.id}, this)"><i class="fas fa-times"></i></button>
                        </div>
                    </div>`;
                });
                html += '</div>';
                verifCard.innerHTML = html;
            }
        } catch(err) { console.error('Failed to load verifications', err); }
    }

    async function approveVerification(id, btn) {
        if(!confirm('Approve this match result?')) return;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/verifications/${id}/approve`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) { showToast('Match approved', 'success'); fetchAdminVerifications(); }
            else { showToast('Failed to approve', 'error'); }
        } catch(err) { showToast('Server error', 'error'); }
        finally { btn.innerHTML = '<i class="fas fa-check"></i>'; btn.disabled = false; }
    }

    async function rejectVerification(id, btn) {
        if(!confirm('Reject this match result?')) return;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/admin/verifications/${id}/reject`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) { showToast('Match rejected', 'success'); fetchAdminVerifications(); }
            else { showToast('Failed to reject', 'error'); }
        } catch(err) { showToast('Server error', 'error'); }
        finally { btn.innerHTML = '<i class="fas fa-times"></i>'; btn.disabled = false; }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchAdminTournaments();
        fetchAdminStats();
        fetchAdminPlayers();
        fetchAdminPayments();
        fetchAdminVerifications();
    });
</script>
