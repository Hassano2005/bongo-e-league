<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Hub — Bongo eLeague</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .t-header { padding: 3.5rem 2.5rem 2.5rem; background: rgba(0,210,255,0.03); border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
        .t-header::before { content: ''; position: absolute; top:0; left:0; right:0; height: 1px; background: linear-gradient(90deg, transparent, var(--primary), transparent); }
        .t-title { font-family:'Orbitron',sans-serif; font-size:2.5rem; font-weight:900; color:var(--text-light); margin-bottom:1.5rem; text-shadow: 0 0 20px rgba(0,210,255,0.2); }
        .t-info { display:flex; gap:2rem; color:var(--text-muted); font-size:1rem; flex-wrap:wrap; }
        .t-info span { display:flex; align-items:center; gap:8px; font-weight:500; }
        .t-section { padding: 3rem 2.5rem; max-width: var(--max-width); margin: 0 auto; }
        .player-row { padding: 1.25rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center; transition: background 0.2s; }
        .player-row:hover { background: rgba(0,210,255,0.02); }
        .player-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="home.html" class="nav-logo">BONGO <span>eLEAGUE</span></a>
    <ul class="nav-links" id="navLinks">
        <li><a href="home.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="tournaments.html" class="active"><i class="fas fa-trophy"></i> Tournaments</a></li>
        <li><a href="leaderboard.html"><i class="fas fa-chart-bar"></i> Leaderboard</a></li>
        <li><a href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
    </ul>
    <div class="nav-actions">
        <span class="nav-badge">BETA</span>
        <div class="nav-avatar" title="My Profile" onclick="window.location.href='profile.html'"><i class="fas fa-user" style="font-size:0.85rem;"></i></div>
        <button class="nav-hamburger" id="navHamburger"><span></span><span></span><span></span></button>
    </div>
</nav>

<div class="page-wrapper" style="padding-top:var(--nav-height);">
    <!-- Headers will be injected here -->
    <div id="tHeader" class="t-header">
        <div style="max-width:var(--max-width);margin:0 auto;text-align:center;padding:2rem;">
            <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--primary);"></i>
        </div>
    </div>

    <div class="t-section">
        <div style="display:flex;align-items:center;gap:15px;margin-bottom:1.5rem;">
            <h2 style="font-family:'Orbitron',sans-serif;font-size:1.5rem;"><i class="fas fa-users" style="color:var(--primary);"></i> Tournament Roster</h2>
            <div style="height:1px;flex:1;background:var(--border-light);"></div>
        </div>
        <div class="card" id="playersCard">
            <div style="padding:3rem;text-align:center;color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading players...</div>
        </div>
    </div>
</div>

<script src="main.js"></script>
<script src="main.js"></script>
<script>
    // 🔗 Your live backend API - ADD THIS CONSTANT
    const API_BASE = 'https://bongo-e-league-31xh.onrender.com';

    const urlParams = new URLSearchParams(window.location.search);
    const tId = urlParams.get('id');

    async function loadTournament() {
        if(!tId) { window.location.href = 'tournaments.html'; return; }
        try {
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/tournaments/${tId}/details`);
            const data = await res.json();
            
            if(!res.ok) { 
                document.getElementById('tHeader').innerHTML = `<div style="max-width:var(--max-width);margin:0 auto;padding:2rem;color:var(--accent);"><h3>Error: ${data.error}</h3></div>`; 
                return; 
            }
            
            const { tournament: t, players } = data;
            
            document.getElementById('tHeader').innerHTML = `
                <div style="max-width: var(--max-width); margin: 0 auto;">
                    <a href="tournaments.html" style="color:var(--primary);text-decoration:none;font-size:0.9rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;"><i class="fas fa-arrow-left"></i> Tournament Directory</a>
                    <h1 class="t-title" style="margin-top:1.5rem;">${t.name}</h1>
                    <div class="t-info">
                        <span><i class="fas fa-sitemap" style="color:var(--primary);"></i> <strong style="color:var(--text-light);">${t.status.toUpperCase()}</strong></span>
                        <span><i class="fas fa-coins" style="color:var(--accent-gold);"></i> <strong style="color:var(--accent-gold);">${t.prize_pool} TZS Prize</strong></span>
                        <span><i class="fas fa-ticket-alt" style="color:var(--text-light);"></i> <strong>${t.entry_fee} TZS Entry</strong></span>
                        <span><i class="fas fa-users" style="color:var(--primary);"></i> <strong style="color:var(--text-light);">${players.length} Registered</strong></span>
                    </div>
                </div>
            `;
            
            if (players.length > 0) {
                let html = '';
                players.forEach((p, i) => {
                    let badge = '';
                    if(p.placement === 1) badge = '<span class="badge" style="background:rgba(245,166,35,0.15);color:#f5a623;border-color:#f5a623;font-size:0.75rem;">🥇 1st Place</span>';
                    else if(p.placement === 2) badge = '<span class="badge" style="background:rgba(176,190,197,0.15);color:#b0bec5;border-color:#b0bec5;font-size:0.75rem;">🥈 2nd Place</span>';
                    else if(p.placement === 3) badge = '<span class="badge" style="background:rgba(205,127,50,0.15);color:#cd7f32;border-color:#cd7f32;font-size:0.75rem;">🥉 3rd Place</span>';
                    else badge = '<span class="badge" style="background:rgba(255,255,255,0.05);color:var(--text-muted);border:1px solid transparent;">Active</span>';
                    
                    html += `
                    <div class="player-row">
                        <div style="font-weight:700;color:var(--text-light);font-size:1.15rem;">
                            <span style="color:var(--text-muted);font-weight:400;margin-right:15px;font-size:0.9rem;font-family:'Orbitron',sans-serif;">${(i+1).toString().padStart(2, '0')}</span>
                            ${p.username}
                            <span style="margin-left:15px;">${badge}</span>
                        </div>
                        <div style="font-size:0.8rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;">Joined ${new Date(p.joined_at).toLocaleDateString()}</div>
                    </div>`;
                });
                document.getElementById('playersCard').innerHTML = html;
            } else {
                document.getElementById('playersCard').innerHTML = '<div style="padding:4rem;text-align:center;color:var(--text-muted);font-size:1.1rem;"><i class="fas fa-ghost" style="display:block;font-size:2.5rem;margin-bottom:1rem;opacity:0.5;"></i>No players have stepped up yet.</div>';
            }
        } catch(e) {
            console.error(e);
            document.getElementById('tHeader').innerHTML = `<h3 style="color:var(--accent);padding:2rem;text-align:center;">Server connection failed</h3>`;
        }
    }

    document.addEventListener('DOMContentLoaded', loadTournament);
</script>
</body>
</html>
