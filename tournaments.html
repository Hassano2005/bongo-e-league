<script src="main.js"></script>
<script>
    // 🔗 Your live backend API - ADD THIS CONSTANT
    const API_BASE = 'https://bongo-e-league-31xh.onrender.com';

    /* ────────────────────────────────────────────────
       KNOCKOUT EXPLAINER — shows round stages
    ──────────────────────────────────────────────── */
    function getRounds(playerCount) {
        const stages = [];
        if (playerCount >= 32) stages.push({ label: 'Round of 32', icon: '⚔️', players: 32 });
        if (playerCount >= 16) stages.push({ label: 'Round of 16', icon: '⚔️', players: 16 });
        if (playerCount >= 8)  stages.push({ label: 'Quarter-Final', icon: '🔥', players: 8 });
        if (playerCount >= 4)  stages.push({ label: 'Semi-Final', icon: '⚡', players: 4 });
        stages.push({ label: 'Final', icon: '🏆', players: 2 });
        stages.push({ label: 'Champion', icon: '👑', players: 1 });
        return stages;
    }

    function renderKoExplainer(playerCount = 16) {
        const stages = getRounds(playerCount);
        const container = document.getElementById('koExplainer');
        container.innerHTML = stages.map((s, i) => `
            ${ i > 0 ? '<span class="ko-arrow"><i class="fas fa-chevron-right"></i></span>' : '' }
            <div class="ko-stage">
                <div class="ko-stage-icon" style="${i === stages.length - 1 ? 'border-color:var(--accent-gold);background:rgba(245,166,35,0.08);' : ''}">${s.icon}</div>
                <div class="ko-stage-label">${s.label}</div>
                <div class="ko-stage-count">${s.players} player${s.players !== 1 ? 's' : ''}</div>
            </div>
        `).join('');
    }

    /* ────────────────────────────────────────────────
       BRACKET RENDERER — empty TBD slots
    ──────────────────────────────────────────────── */
    function renderBracket(playerCount = 16) {
        const container = document.getElementById('bracketView');

        // Build rounds based on players
        const roundDefs = [];
        let count = playerCount;
        while (count >= 2) {
            roundDefs.push(count);
            count = Math.floor(count / 2);
        }

        const roundNames = (total) => {
            const n = [];
            let c = total;
            while (c >= 2) {
                if      (c === 32) n.push('Round of 32');
                else if (c === 16) n.push('Round of 16');
                else if (c === 8)  n.push('Quarter-Finals');
                else if (c === 4)  n.push('Semi-Finals');
                else if (c === 2)  n.push('Final');
                c = Math.floor(c / 2);
            }
            return n;
        };

        const names = roundNames(playerCount);
        let seed = 1;

        container.innerHTML = roundDefs.map((matchCount, ri) => {
            const matchesInRound = matchCount / 2;
            const roundMatches = Array.from({ length: matchesInRound }, (_, mi) => {
                const isFirstRound = ri === 0;
                const p1 = isFirstRound ? seed++ : null;
                const p2 = isFirstRound ? seed++ : null;
                return { p1, p2 };
            });

            return `
                <div class="bracket-round" style="justify-content:space-evenly;">
                    <div class="bracket-round-title">${names[ri]}</div>
                    ${roundMatches.map(m => `
                        <div class="bracket-match">
                            <div class="bracket-slot tbd">
                                <span class="slot-num">${m.p1 ?? '?'}</span>
                                <div class="slot-dot"></div>
                                <span style="flex:1;">TBD</span>
                            </div>
                            <div class="bracket-slot tbd">
                                <span class="slot-num">${m.p2 ?? '?'}</span>
                                <div class="slot-dot"></div>
                                <span style="flex:1;">TBD</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }).join('');

        renderKoExplainer(playerCount);
    }

    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
        });
    });

    function selectPayment(el) {
        document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
    }

    /* ── API INTEGRATION ── */
    let selectedTournamentId = null;

    async function fetchTournaments() {
        try {
            const token = localStorage.getItem('league_token');
            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/tournaments`, {
                headers: token ? { 'Authorization': `Bearer ${token}` } : {}
            });
            const data = await res.json();
            const listCard = document.getElementById('tournamentListCard');
            
            if (data.length === 0) return; // Keep empty state
            
            let html = '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:1.5rem; padding:1.5rem;">';
            data.forEach(t => {
                const actionBtn = t.has_joined ? 
                    `<button class="btn btn-outline btn-sm" style="width:100%; justify-content:center; color:var(--primary); border-color:var(--primary);" onclick="window.location.href='tournament_details.html?id=${t.id}'">
                        <i class="fas fa-eye"></i> View Tournament
                    </button>` :
                    `<button class="btn btn-primary btn-sm" style="width:100%; justify-content:center;" onclick="openJoinModal(${t.id}, '${t.name}', ${t.entry_fee}, ${t.prize_pool})">
                        <i class="fas fa-plus"></i> Join Tournament
                    </button>`;
                    
                html += `
                    <div class="card" style="border:1px solid rgba(0, 210, 255, 0.2); background:rgba(0, 210, 255, 0.02); padding:1.5rem;">
                        <div class="format-badge" style="margin-bottom:10px;"><i class="fas fa-sitemap"></i> ${t.status.toUpperCase()}</div>
                        <h3 style="font-family:'Orbitron',sans-serif; font-size:1.2rem; color:var(--text-light); margin-bottom:5px;">${t.name}</h3>
                        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px; line-height: 1.6;">
                            Entry: <strong style="color:var(--text-light);">${t.entry_fee} TZS</strong> | Prize: <strong style="color:var(--accent-gold);">${t.prize_pool} TZS</strong><br>
                            <span style="font-size:0.75rem; color:var(--primary);"><i class="fas fa-user-friends"></i> ${t.joined_count || 0} Player${(t.joined_count||0) !== 1 ? 's' : ''} Joined</span>
                        </p>
                        ${actionBtn}
                    </div>
                `;
            });
            html += '</div>';
            listCard.innerHTML = html;

        } catch (err) {
            console.error(err);
            showToast('Failed to load tournaments', 'error');
        }
    }

    function openJoinModal(id, name, fee, prize) {
        const token = localStorage.getItem('league_token');
        if (!token) {
            showToast('Please login first to join tournaments.', 'error');
            setTimeout(() => window.location.href = 'index.html', 1500);
            return;
        }
        
        selectedTournamentId = id;
        document.getElementById('joinTournamentName').textContent = name;
        document.getElementById('joinFee').textContent = fee + ' TZS';
        openModal('joinModal');
    }

    async function confirmJoin() {
        const phone = document.getElementById('joinPhone').value.trim();
        if (!phone) { showToast('Please enter your phone number', 'error'); return; }
        const btn = document.getElementById('joinPayBtn');
        
        const token = localStorage.getItem('league_token');
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        btn.disabled = true;

        try {
            const amountStr = document.getElementById('joinFee').textContent.replace(/,/g, '').replace(' TZS', '');
            const amount = parseInt(amountStr) || 0;

            // ✅ Use full URL:
            const res = await fetch(`${API_BASE}/api/payments/submit`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    tournament_id: selectedTournamentId,
                    phone_number: phone,
                    amount: amount
                })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                closeModal('joinModal');
                showToast('Payment submitted for verification. Admin will review!', 'success', 3000);
                setTimeout(() => window.location.href = 'profile.html', 1500);
            } else {
                showToast(data.error || 'Failed to submit payment', 'error');
            }
        } catch(err) {
            console.error(err);
            showToast('Server error', 'error');
        } finally {
            btn.innerHTML = '<i class="fas fa-lock"></i> Confirm & Pay';
            btn.disabled = false;
        }
    }

    /* ── Init ── */
    document.addEventListener('DOMContentLoaded', () => {
        renderBracket(16);
        fetchTournaments();
    });
</script>
